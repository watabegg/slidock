<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Slive</title>
    <link rel="icon" type="image/svg+xml" href="slive.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="presenter-header">
      <button
        id="home-button"
        class="icon-button"
        title="戻る（Alt + ←）"
        aria-label="一覧に戻る"
        data-icon="back"
      ></button>
      <img class="app-brand-icon" src="slive.svg" width="30" height="30" alt="Slive" />
      <h1 id="deck-title"></h1>
      <div id="status" role="status"></div>
      <details id="display-settings">
        <summary class="icon-button" title="投影先の設定" aria-label="投影先の設定">
          <span data-icon="monitor"></span>
        </summary>
        <div class="display-popover">
          <h2>投影先</h2>
          <select id="displays" aria-label="投影先ディスプレイ"></select>
          <label><input type="checkbox" id="fullscreen" /> 全画面で表示</label>
          <div class="display-actions">
            <button id="apply-display">適用</button
            ><button
              id="swap"
              class="icon-button"
              aria-label="画面を入れ替える"
              title="画面を入れ替える"
              data-icon="swap"
            ></button>
          </div>
          <p id="display-status" role="status"></p>
        </div>
      </details>
      <button
        class="icon-button"
        data-open-settings
        aria-label="設定"
        title="設定"
        data-icon="settings"
      ></button>
    </header>
    <section id="library" hidden>
      <aside class="library-sidebar">
        <div class="library-brand">
          <img class="app-brand-icon" src="slive.svg" width="112" height="112" alt="" />
          <h1>Slive</h1>
        </div>
        <nav id="library-categories" aria-label="カテゴリ"></nav>
        <button class="sidebar-settings" data-open-settings aria-label="設定" title="設定">
          <span data-icon="settings"></span><span>設定</span>
        </button>
      </aside>
      <div class="library-content">
        <div class="library-heading">
          <label class="search">
            <span data-icon="search"></span>
            <input
              id="library-search"
              type="search"
              placeholder="資料を検索"
              aria-label="資料を検索"
            />
          </label>
        </div>
        <p id="library-status" role="status"></p>
        <div id="library-grid"></div>
      </div>
    </section>
    <main id="presentation">
      <div id="viewer">
        <iframe id="deck" title="スライド" sandbox="allow-scripts allow-same-origin"></iframe>
        <div id="blackout"></div>
      </div>
      <aside id="notes-panel">
        <div class="next-heading" id="next-heading">次のスライド</div>
        <div id="preview-container">
          <iframe
            id="next-preview"
            title="次のスライド"
            tabindex="-1"
            sandbox="allow-scripts allow-same-origin"
          ></iframe>
        </div>
        <div class="notes-heading">
          <h2>ノート</h2>
          <label class="font-size" title="ノートの文字サイズ"
            ><span aria-hidden="true">Aa</span
            ><input
              id="note-size"
              type="range"
              min="12"
              max="28"
              value="16"
              aria-label="ノートの文字サイズ"
          /></label>
        </div>
        <textarea
          id="notes"
          aria-label="発表者ノート"
          placeholder="ノート"
          spellcheck="false"
        ></textarea>
        <div class="notes-footer">
          <span id="note-status" role="status"></span
          ><button
            id="save"
            class="icon-button"
            title="ノートを保存"
            aria-label="ノートを保存"
            data-icon="save"
          ></button>
        </div>
      </aside>
    </main>
    <footer id="controls">
      <div class="page-controls">
        <button
          class="icon-button"
          data-action="previous"
          title="前へ（←）"
          aria-label="前へ"
          data-icon="previous"
        ></button
        ><span id="page"></span
        ><button
          class="icon-button"
          data-action="next"
          title="次へ（→）"
          aria-label="次へ"
          data-icon="next"
        ></button>
      </div>
      <button
        class="icon-button"
        data-action="toggleBlackout"
        title="投影を暗転（B）"
        aria-label="投影を暗転"
        aria-pressed="false"
        data-icon="blackout"
      ></button>
      <div class="timer-controls">
        <span id="timer">00:00</span
        ><button
          class="icon-button"
          data-action="toggleTimer"
          title="タイマー開始"
          aria-label="タイマー開始"
          data-icon="play"
        ></button
        ><button
          class="icon-button"
          data-action="resetTimer"
          title="タイマーをリセット"
          aria-label="タイマーをリセット"
          data-icon="reset"
        ></button>
      </div>
    </footer>
    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <div class="settings-header">
        <h1 id="settings-title">設定</h1>
        <button
          id="settings-close"
          class="icon-button"
          aria-label="設定を閉じる"
          title="閉じる"
          data-icon="close"
        ></button>
      </div>
      <div class="settings-content">
        <section class="settings-section" aria-labelledby="appearance-title">
          <h2 id="appearance-title">外観</h2>
          <div class="theme-options" role="group" aria-label="外観">
            <button data-theme-choice="light" aria-pressed="false">
              <span data-icon="sun"></span>ライト
            </button>
            <button data-theme-choice="dark" aria-pressed="false">
              <span data-icon="moon"></span>ダーク
            </button>
            <button data-theme-choice="system" aria-pressed="false">
              <span data-icon="monitor"></span>システム
            </button>
          </div>
        </section>
        <section class="settings-section" aria-labelledby="connection-title">
          <h2 id="connection-title">接続先</h2>
          <form id="connection-form">
            <div class="connection-options">
              <label><input type="radio" name="connection" value="local" />このPCの資料</label>
              <label><input type="radio" name="connection" value="web" />Slidock のURL</label>
            </div>
            <p id="local-unavailable" class="settings-hint" hidden>
              ローカル資料を指定して起動すると選べます。
            </p>
            <label id="connection-url-label" for="connection-url">URL</label>
            <input
              id="connection-url"
              type="url"
              placeholder="https://slides.example.com"
              autocomplete="off"
              spellcheck="false"
            />
            <p id="connection-hint" class="settings-hint">localhost のURLも指定できます。</p>
            <div class="settings-actions">
              <button id="connection-apply" type="submit">接続して再起動</button>
            </div>
          </form>
        </section>
        <p id="settings-status" role="status"></p>
      </div>
    </dialog>
    <script src="frame-controller.js"></script>
    <script src="app.js"></script>
  </body>
</html>
