name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      portable: ${{ steps.paths.outputs.portable }}
      framework: ${{ steps.paths.outputs.framework }}
      server: ${{ steps.paths.outputs.server }}
      native: ${{ steps.paths.outputs.native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Select heavy suites (manual runs and unknown inputs run all)
        id: paths
        run: node scripts/ci-changes.mjs
  portable:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d hub"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HUB_TEST_DATABASE_URL: postgres://hub:local-test-only@127.0.0.1:5432/hub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - run: npm install --global pnpm@12.3.4
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-node24-
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/apt-archives/*.deb
          key: apt-browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/checks.yml') }}
          restore-keys: apt-browser-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache apt downloads (packages are still installed on every runner)
        run: |
          mkdir -p "$HOME/.cache/apt-archives"
          printf 'Dir::Cache::archives "%s";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME/.cache/apt-archives" | sudo tee /etc/apt/apt.conf.d/99-ci-cache > /dev/null
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build workspace packages once
        run: |
          pnpm build:packages
          echo "SLIDOCK_PACKAGES_BUILT=1" >> "$GITHUB_ENV"
      - run: pnpm check
      - name: Build browser runtime and Slive UI
        if: needs.changes.outputs.portable != 'true'
        run: |
          pnpm build:workers
          pnpm build:slive-ui
      - name: Portable browser and integration regression
        if: needs.changes.outputs.portable == 'true'
        run: pnpm verify:portable --skip-checks
      - run: pnpm verify:packed-cli
        if: needs.changes.outputs.portable == 'true'
  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d hub"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # Publication E2E requires a disposable database at 127.0.0.1:55461/hub_jobs.
      postgres-jobs:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: hub_jobs
        ports:
          - 55461:5432
        options: >-
          --health-cmd "pg_isready -U hub -d hub_jobs"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HUB_TEST_DATABASE_URL: postgres://hub:local-test-only@127.0.0.1:5432/hub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - run: npm install --global pnpm@12.3.4
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-node24-
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/apt-archives/*.deb
          key: apt-browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/checks.yml') }}
          restore-keys: apt-browser-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache apt downloads (packages are still installed on every runner)
        run: |
          mkdir -p "$HOME/.cache/apt-archives"
          printf 'Dir::Cache::archives "%s";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME/.cache/apt-archives" | sudo tee /etc/apt/apt.conf.d/99-ci-cache > /dev/null
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build workspace packages once
        run: |
          pnpm build:packages
          echo "SLIDOCK_PACKAGES_BUILT=1" >> "$GITHUB_ENV"
      - run: pnpm verify:packed-server
      - run: pnpm verify:server
      - run: pnpm verify:publication-jobs
        env:
          HUB_TEST_DATABASE_URL: postgres://hub:local-test-only@127.0.0.1:55461/hub_jobs
  framework:
    needs: changes
    if: needs.changes.outputs.framework == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - run: npm install --global pnpm@12.3.4
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-node24-
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/apt-archives/*.deb
          key: apt-browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/checks.yml') }}
          restore-keys: apt-browser-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache apt downloads (packages are still installed on every runner)
        run: |
          mkdir -p "$HOME/.cache/apt-archives"
          printf 'Dir::Cache::archives "%s";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME/.cache/apt-archives" | sudo tee /etc/apt/apt.conf.d/99-ci-cache > /dev/null
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build workspace packages once
        run: |
          pnpm build:packages
          echo "SLIDOCK_PACKAGES_BUILT=1" >> "$GITHUB_ENV"
      - run: pnpm verify:packed-framework
      - run: pnpm verify:framework-frontend
      - run: pnpm verify:pages
  rust-core:
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Identify Rust toolchain
        id: rust
        run: echo "version=$(rustc -vV | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            apps/slive/target
          key: cargo-core-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('apps/slive/**/Cargo.toml', 'apps/slive/Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-core-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('apps/slive/**/Cargo.toml', 'apps/slive/Cargo.lock') }}-
      - run: cargo test --locked --manifest-path apps/slive/Cargo.toml -p slive-core -p slive
  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: '0'
      NO_AT_BRIDGE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - run: npm install --global pnpm@12.3.4
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-node24-
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/apt-archives/*.deb
          key: apt-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/checks.yml') }}
          restore-keys: apt-native-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache apt downloads (packages are still installed on every runner)
        run: |
          mkdir -p "$HOME/.cache/apt-archives"
          printf 'Dir::Cache::archives "%s";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME/.cache/apt-archives" | sudo tee /etc/apt/apt.conf.d/99-ci-cache > /dev/null
      - name: Install Linux desktop SDK and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb dbus-x11
          pnpm exec playwright install --with-deps chromium
      - name: Identify Rust toolchain
        id: rust
        run: echo "version=$(rustc -vV | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            apps/slive/target
          key: cargo-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('apps/slive/**/Cargo.toml', 'apps/slive/Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('apps/slive/**/Cargo.toml', 'apps/slive/Cargo.lock') }}-
      - name: Build workspace packages once
        run: |
          pnpm build:packages
          echo "SLIDOCK_PACKAGES_BUILT=1" >> "$GITHUB_ENV"
      - run: pnpm build:slidock:fixtures
      - name: Workers and static Slive native regression
        run: xvfb-run -a dbus-run-session -- sh -c 'pnpm verify:workers-slive && pnpm verify:slive'
